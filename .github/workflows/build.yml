name: Build HClick
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Prepare project structure
      run: |
        mkdir -p MyCustomApp
        cp ContentView.swift MyCustomApp/ContentView.swift
        cp MyApp.swift MyCustomApp/MyApp.swift

        cat << 'EOF' > MyCustomApp/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>HClick</string>
            <key>CFBundleIdentifier</key>
            <string>com.hayrx.hclick</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>HClick</string>
            <key>CFBundleDisplayName</key>
            <string>HClick</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        EOF

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: |
        cd MyCustomApp
        cat << 'EOF' > project.yml
        name: HClick
        options:
          bundleIdPrefix: com.hayrx
          deploymentTarget:
            iOS: "15.0"
        targets:
          HClick:
            type: application
            platform: iOS
            sources:
              - MyApp.swift
              - ContentView.swift
            info:
              path: Info.plist
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.hayrx.hclick
                PRODUCT_NAME: HClick
                MARKETING_VERSION: "1.0"
                CURRENT_PROJECT_VERSION: "1"
                SWIFT_VERSION: "5.0"
                TARGETED_DEVICE_FAMILY: "1"
                GENERATE_INFOPLIST_FILE: NO
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
        EOF
        xcodegen generate

    - name: Build with Xcode
      run: |
        cd MyCustomApp
        xcodebuild -project HClick.xcodeproj \
          -scheme HClick \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ONLY_ACTIVE_ARCH=NO \
          -derivedDataPath build

    - name: Package into IPA
      run: |
        mkdir -p Payload
        APP_PATH=$(find MyCustomApp/build -name "HClick.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "❌ .app file not found!"
          find MyCustomApp/build -name "*.app" -type d
          exit 1
        fi
        echo "✅ Found .app at: $APP_PATH"
        cp -r "$APP_PATH" Payload/
        zip -r HClick.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HClick
        path: HClick.ipa
