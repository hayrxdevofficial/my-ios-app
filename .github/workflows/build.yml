                E1A2B3C4D5E6F7G8H0 /* MyApp.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = MyApp.swift; sourceTree = "<group>"; };
                E1A2B3C4D5E6F7G8H1 /* ContentView.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = ContentView.swift; sourceTree = "<group>"; };
                E1A2B3C4D5E6F7G8H2 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
                /* End PBXFileReference section */
                
                /* Begin PBXGroup section */
                E1A2B3C4D5E6F7G8H3 = {isa = PBXGroup; children = (E1A2B3C4D5E6F7G8H0, E1A2B3C4D5E6F7G8H1, E1A2B3C4D5E6F7G8H2, E1A2B3C4D5E6F7G8H4,); sourceTree = "<group>"; };
                E1A2B3C4D5E6F7G8H4 /* Products */ = {isa = PBXGroup; children = (E1A2B3C4D5E6F7G8H9,); sourceTree = "<group>"; };
                /* End PBXGroup section */
                
                /* Begin PBXProject section */
                E1A2B3C4D5E6F7G8H5 /* Project object */ = {
                    isa = PBXProject;
                    attributes = {
                        BuildIndependentTargetsInParallel = 1;
                        LastSwiftUpdateCheck = 1500;
                        LastUpgradeCheck = 1500;
                        TargetAttributes = {
                            E1A2B3C4D5E6F7G8H6 = {
                                CreatedOnToolsVersion = 15.0;
                            };
                        };
                    };
                    buildConfigurationList = E1A2B3C4D5E6F7G8H7 /* Build configuration list for PBXProject "MyCustomApp" */;
                    compatibilityVersion = "Xcode 14.0";
                    developmentRegion = en;
                    hasScannedForEncodings = 0;
                    knownRegions = (
                        en,
                        Base,
                    );
                    mainGroup = E1A2B3C4D5E6F7G8H3;
                    productRefGroup = E1A2B3C4D5E6F7G8H4 /* Products */;
                    projectDirPath = "";
                    projectRoot = "";
                    targets = (
                        E1A2B3C4D5E6F7G8H6 /* MyCustomApp */,
                    );
                };
                /* End PBXProject section */
                
                /* Begin PBXTargetDependency section */
                /* End PBXTargetDependency section */
                
                /* Begin XCBuildConfiguration section */
                E1A2B3C4D5E6F7G8H8 /* Debug */ = {
                    isa = XCBuildConfiguration;
                    buildSettings = {
                        ALWAYS_SEARCH_USER_PATHS = NO;
                        CLANG_ANALYZER_NONNULL = YES;
                        CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION = YES_AGGRESSIVE;
                        CLANG_CXX_LANGUAGE_STANDARD = "gnu++20";
                        CLANG_ENABLE_MODULES = YES;
                        CLANG_ENABLE_OBJC_ARC = YES;
                        CLANG_ENABLE_OBJC_WEAK = YES;
