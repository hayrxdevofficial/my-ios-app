name: Build My First Custom App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create Real Xcode Project
      run: |
        mkdir -p MyCustomApp
        # Проверяем наличие файлов и копируем
        if [ -f "ContentView.swift" ]; then
          mv ContentView.swift MyCustomApp/
        fi
        if [ -f "MyApp.swift" ]; then
          mv MyApp.swift MyCustomApp/
        fi
        
        # Создаем Info.plist
        cat << 'EOF' > MyCustomApp/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>MyCustomApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.myname.mycustomapp</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>My First App</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
                <string>UIInterfaceOrientationPortrait</string>
            </array>
        </dict>
        </plist>
        EOF
        
        # Создаем простой Swift файл для теста, если его нет
        if [ ! -f "MyCustomApp/MyApp.swift" ]; then
          cat << 'EOF' > MyCustomApp/MyApp.swift
        import SwiftUI

        @main
        struct MyCustomApp: App {
            var body: some Scene {
                WindowGroup {
                    ContentView()
                }
            }
        }
        EOF
        fi
        
        if [ ! -f "MyCustomApp/ContentView.swift" ]; then
          cat << 'EOF' > MyCustomApp/ContentView.swift
        import SwiftUI

        struct ContentView: View {
            var body: some View {
                VStack {
                    Image(systemName: "globe")
                        .imageScale(.large)
                        .foregroundStyle(.tint)
                    Text("Hello, World!")
                }
                .padding()
            }
        }

        #Preview {
            ContentView()
        }
        EOF
        fi

    - name: Create Xcode Project
      run: |
        # Создаем полноценный Xcode проект
        cd MyCustomApp
        
        # Создаем .xcodeproj директорию
        mkdir -p MyCustomApp.xcodeproj
        
        # Создаем project.pbxproj
        cat << 'EOF' > MyCustomApp.xcodeproj/project.pbxproj
        // !$*UTF8*$!
        {
            archiveVersion = 1;
            classes = {
            };
            objectVersion = 56;
            objects = {
