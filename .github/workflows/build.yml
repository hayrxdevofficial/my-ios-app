name: Build My First Custom App
on:
  workflow_dispatch: # Запуск вручную по кнопке

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. Скачиваем ваши файлы кода из репозитория
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Создаем структуру проекта, которую понимает Xcode
    - name: Prepare Swift Package Project
      run: |
        mkdir -p MyCustomApp/Sources
        mv ContentView.swift MyCustomApp/Sources/
        mv MyApp.swift MyCustomApp/Sources/
        
        # Создаем файл настроек
        cat << 'EOF' > MyCustomApp/Package.swift
        // swift-tools-version: 5.9
        import PackageDescription

        let package = Package(
            name: "MyCustomApp",
            platforms: [.iOS(.v15)],
            products: [.executable(name: "MyCustomApp", targets: ["MyCustomApp"])],
            targets: [.executableTarget(name: "MyCustomApp", path: "Sources")]
        )
        EOF

    # 3. Компилируем код с указанием точного пути к библиотекам iOS SDK
    - name: Build iOS Executable
      run: |
        cd MyCustomApp
        # Находим в системе точный путь к библиотекам iOS
        IOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        
        # Запускаем сборку, подкинув правильный SDK компилятору
        swift build -c release --triple arm64-apple-ios15.0 -Xswiftc -sdk -Xswiftc "$IOS_SDK_PATH"

    # 4. Собираем приложение в готовую структуру папок
    - name: Package into App Folder
      run: |
        mkdir -p Payload/MyCustomApp.app
        
        # Находим скомпилированный файл программы и копируем его
        cp MyCustomApp/.build/plugins/Outputs/MyCustomApp Payload/MyCustomApp.app/MyCustomApp
        
        # Создаем обязательный файл описания приложения
        cat << 'EOF' > Payload/MyCustomApp.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>MyCustomApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.myname.mycustomapp</string>
            <key>CFBundleName</key>
            <string>My First App</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
        </dict>
        </plist>
        EOF
        
        # Архивируем в формат .ipa
        zip -r MyFirstApp.ipa Payload

    # 5. Выкладываем файл для скачивания
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-first-ios-app
        path: MyFirstApp.ipa
